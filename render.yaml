databases:
  - name: hrms-db
    plan: free
    databaseName: hrms
    user: hrms

services:
  - type: web
    name: hrms-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hrms-client-9cs0.onrender.com
      - key: PORT
        value: 4000

  - type: web
    name: hrms-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hrms-api-p740.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
